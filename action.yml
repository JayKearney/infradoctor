name: infradoctor
description: Catch overlapping VPCs, version drift and dependency problems in pull requests

branding:
  icon: activity
  color: green

inputs:
  args:
    description: 'Arguments for infradoctor, e.g. "network check terraform/"'
    required: true
  fail-on:
    description: 'Fail the step on "error" (default) or also on "warning"'
    required: false
    default: error
  python-version:
    description: Python version to run infradoctor with
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install infradoctor
      shell: bash
      run: pip install --quiet "$ACTION_PATH"
      env:
        ACTION_PATH: ${{ github.action_path }}

    - name: Run infradoctor
      shell: bash
      run: infradoctor --fail-on "$FAIL_ON" $INFRADOCTOR_ARGS
      env:
        FAIL_ON: ${{ inputs.fail-on }}
        INFRADOCTOR_ARGS: ${{ inputs.args }}